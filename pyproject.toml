[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentbisect"
version = "0.1.0"
description = "Git bisect for AI coding agents. Pinpoint and fork the exact step where an agent broke your codebase."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "AgentBisect Contributors"}
]
keywords = [
    "ai-agents",
    "git-bisect",
    "debugging",
    "claude-code",
    "cursor",
    "antigravity",
    "mcp",
    "llm-tools"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "click>=8.0.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "jinja2>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
agentbisect = "agentbisect.cli:main"

[project.urls]
Homepage = "https://github.com/test-bit-sys/agentbisect"
Documentation = "https://github.com/test-bit-sys/agentbisect#readme"
Repository = "https://github.com/test-bit-sys/agentbisect.git"
Issues = "https://github.com/test-bit-sys/agentbisect/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentbisect*"]
